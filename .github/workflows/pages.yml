name: Publish teacher demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Embed scripts, styles and fictional Excel examples
        run: python3 tools/package_teacher_demo.py --dist dist --output site
      - name: Keep the published artifact minimal
        run: |
          mkdir published
          cp site/index.html published/index.html
          touch published/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: published
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
